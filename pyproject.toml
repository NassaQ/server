[project]
name = "nassaq-server"
version = "0.1.0"
description = "NassaQ Python infrastructure/backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aioodbc>=0.5.0",
    "fastapi>=0.128.0",
    "openai>=1.30.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.12.5",
    "pyodbc>=5.3.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.21",
    "sqlacodegen>=3.2.0",
    "sqlalchemy>=2.0.45",
    "uvicorn[standard]>=0.40.0",
    "azure-storage-blob>=12.20.0",
    "azure-search-documents>=11.6.0",
    "aio-pika>=9.6.2",
    "azure-servicebus>=7.14.3",
    "numpy>=2.4.4",
    "gunicorn>=25.3.0",
    "aiohttp>=3.13.5",
    "motor>=3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = "."
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]
